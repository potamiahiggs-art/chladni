<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chladni Cymatics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a84b;
      --gold-dim: rgba(200,168,75,0.15);
      --bg: #0d0d0d;
      --panel: #141414;
      --border: rgba(255,255,255,0.07);
      --text-dim: rgba(255,255,255,0.25);
      --text-mid: rgba(255,255,255,0.5);
    }

    body {
      background: var(--bg);
      color: #e8e8e8;
      font-family: 'Space Mono', monospace;
      min-height: 600vh;
    }

    /* ── Sticky viewport ── */
    .sticky-wrap {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      gap: 22px;
      overflow: hidden;
    }

    header { text-align: center; }
    header h1 {
      font-size: 10px; letter-spacing: .3em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 4px;
    }
    header p { font-size: 8px; letter-spacing: .15em; color: var(--text-dim); }

    .stage {
      display: flex; gap: 24px;
      align-items: flex-start; flex-wrap: wrap;
      justify-content: center; width: 100%; max-width: 820px;
    }

    /* ── Canvas ── */
    .canvas-wrap { position: relative; flex-shrink: 0; }
    #sketch-container {
      width: 500px; height: 500px;
      background: #111; border-radius: 4px;
      overflow: hidden;
      outline: 1px solid var(--border);
      box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 1px rgba(200,168,75,0.15);
      position: relative;
    }
    #sketch-container canvas {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
    }

    /* Cinematic flash on pattern change */
    #flash-overlay {
      position: absolute; inset: 0;
      pointer-events: none; border-radius: 4px;
      background: rgba(200,168,75,0);
      z-index: 10;
    }
    #flash-overlay.burst {
      animation: flashBurst 0.6s ease-out forwards;
    }
    @keyframes flashBurst {
      0%   { background: rgba(200,168,75,0.25); }
      20%  { background: rgba(200,168,75,0.09); }
      100% { background: rgba(200,168,75,0); }
    }

    .corner-tag {
      position: absolute; bottom: 10px; right: 12px;
      font-size: 7px; letter-spacing: .14em;
      text-transform: uppercase; color: rgba(255,255,255,0.1);
      pointer-events: none; z-index: 5;
    }

    .pattern-badge {
      position: absolute; top: 12px; left: 12px;
      font-size: 8px; letter-spacing: .14em;
      color: var(--gold); opacity: 0;
      transition: opacity .4s; z-index: 5;
    }
    .pattern-badge.on { opacity: 1; }

    /* Scroll progress bar */
    .scroll-bar-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: rgba(255,255,255,0.04); z-index: 5;
    }
    #scroll-bar {
      height: 100%; width: 0%;
      background: var(--gold);
      transition: width 0.07s linear;
      opacity: 0.55;
    }

    /* ── Controls ── */
    .controls { width: 220px; display: flex; flex-direction: column; gap: 11px; }
    .ctrl-section-label {
      font-size: 7px; letter-spacing: .24em;
      text-transform: uppercase; color: var(--text-dim); padding-left: 2px;
    }
    fieldset {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 11px 13px 12px; background: var(--panel);
    }
    legend {
      font-size: 7px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--text-dim); padding: 0 5px;
    }
    .slider-row {
      display: grid; grid-template-columns: 18px 1fr 36px;
      align-items: center; gap: 8px; margin-top: 10px;
    }
    .sl-label { font-size: 10px; font-weight: 700; color: var(--gold); text-align: center; }
    .sl-label.small { font-size: 7px; color: var(--text-mid); }
    .sl-val { font-size: 9px; color: var(--text-mid); text-align: right; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: var(--gold);
      border: none; cursor: pointer; transition: transform .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.45); }
    input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--gold); border: none; cursor: pointer;
    }

    .color-modes { display: flex; gap: 6px; }
    .color-btn {
      flex: 1; padding: 5px 4px;
      border: 1px solid var(--border); border-radius: 4px;
      background: none; color: var(--text-dim);
      font-family: 'Space Mono', monospace;
      font-size: 7px; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .color-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .color-btn:hover:not(.active) { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.5); }

    /* Randomise button — pulses on scroll trigger */
    .btn-primary {
      width: 100%; padding: 9px;
      background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
      color: rgba(255,255,255,0.55);
      font-family: 'Space Mono', monospace;
      font-size: 8px; letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer; transition: border-color .2s, color .2s, background .2s;
    }
    .btn-primary:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .btn-primary.pulse {
      animation: btnPulse 0.55s ease-out forwards;
    }
    @keyframes btnPulse {
      0%   { border-color: var(--gold); color: var(--gold); background: rgba(200,168,75,0.25); box-shadow: 0 0 0 0 rgba(200,168,75,0.5); }
      55%  { box-shadow: 0 0 0 7px rgba(200,168,75,0); }
      100% { border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); background: none; }
    }

    .btn-save {
      width: 100%; padding: 9px; background: none;
      border: 1px solid rgba(255,255,255,0.07); border-radius: 5px;
      color: rgba(255,255,255,0.3);
      font-family: 'Space Mono', monospace;
      font-size: 8px; letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .btn-save:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }

    .equation {
      padding: 10px 13px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); font-size: 8px; letter-spacing: .06em;
      color: var(--text-dim); line-height: 1.7;
    }
    .equation .val { color: var(--gold); }

    .stats {
      display: flex; border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; background: var(--panel);
    }
    .stat {
      flex: 1; padding: 8px 6px; text-align: center;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-val { display: block; font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }
    .stat-lbl { display: block; font-size: 6px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; }

    /* Scroll hint */
    .scroll-hint {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%);
      font-size: 7px; letter-spacing: .2em;
      color: rgba(255,255,255,0.18); text-transform: uppercase;
      pointer-events: none;
      display: flex; align-items: center; gap: 10px;
      z-index: 20; transition: opacity .5s;
    }
    .scroll-hint.hidden { opacity: 0; }
    .scroll-hint .dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--gold); opacity: 0.35;
      animation: dotBlink 1.7s ease-in-out infinite;
    }
    .scroll-hint .dot:last-child { animation-delay: .4s; }
    @keyframes dotBlink { 0%,100%{opacity:.15} 50%{opacity:.7} }

    @media (max-width: 620px) {
      #sketch-container { width: min(88vw, 500px); height: min(88vw, 500px); }
      .controls { width: min(88vw, 500px); }
    }
  </style>
</head>
<body>

  <div class="sticky-wrap">
    <header>
      <h1>Chladni Cymatics</h1>
      <p>sand particle simulation on a vibrating plate</p>
    </header>

    <div class="stage">
      <div class="canvas-wrap">
        <div id="sketch-container"></div>
        <div id="flash-overlay"></div>
        <div class="scroll-bar-wrap"><div id="scroll-bar"></div></div>
        <span class="corner-tag">chladni</span>
        <span class="pattern-badge" id="badge"></span>
      </div>

      <div class="controls">
        <p class="ctrl-section-label">Frequency</p>
        <fieldset>
          <legend>modes</legend>
          <div class="slider-row">
            <span class="sl-label">m</span>
            <input type="range" id="mSlider" min="1" max="16" step="1" value="8">
            <span class="sl-val" id="mVal">8</span>
          </div>
          <div class="slider-row">
            <span class="sl-label">n</span>
            <input type="range" id="nSlider" min="1" max="16" step="1" value="4">
            <span class="sl-val" id="nVal">4</span>
          </div>
        </fieldset>

        <fieldset>
          <legend>coefficients</legend>
          <div class="slider-row">
            <span class="sl-label">a</span>
            <input type="range" id="aSlider" min="-2" max="2" step="1" value="1">
            <span class="sl-val" id="aVal">1</span>
          </div>
          <div class="slider-row">
            <span class="sl-label">b</span>
            <input type="range" id="bSlider" min="-2" max="2" step="1" value="1">
            <span class="sl-val" id="bVal">1</span>
          </div>
        </fieldset>

        <fieldset>
          <legend>simulation</legend>
          <div class="slider-row">
            <span class="sl-label small">VIB</span>
            <input type="range" id="vSlider" min="0.01" max="0.1" step="0.01" value="0.02">
            <span class="sl-val" id="vVal">0.02</span>
          </div>
          <div class="slider-row">
            <span class="sl-label small">PTC</span>
            <input type="range" id="numSlider" min="1000" max="15000" step="1000" value="10000">
            <span class="sl-val" id="numVal">10k</span>
          </div>
        </fieldset>

        <p class="ctrl-section-label" style="margin-top:2px;">Color Mode</p>
        <div class="color-modes">
          <button class="color-btn active" data-mode="white">White</button>
          <button class="color-btn" data-mode="gold">Gold</button>
          <button class="color-btn" data-mode="heat">Heat</button>
          <button class="color-btn" data-mode="cyan">Cyan</button>
        </div>

        <div class="stats">
          <div class="stat"><span class="stat-val" id="stat-pattern">—</span><span class="stat-lbl">Pattern</span></div>
          <div class="stat"><span class="stat-val" id="stat-nodes">—</span><span class="stat-lbl">m+n</span></div>
          <div class="stat"><span class="stat-val" id="stat-fps">—</span><span class="stat-lbl">FPS</span></div>
        </div>

        <div class="equation">
          f(x,y) = <span class="val" id="eq-a">1</span>·sin(π·<span class="val" id="eq-n">4</span>x)sin(π·<span class="val" id="eq-m">8</span>y)
          + <span class="val" id="eq-b">1</span>·sin(π·<span class="val" id="eq-m2">8</span>x)sin(π·<span class="val" id="eq-n2">4</span>y)
        </div>

        <button class="btn-primary" id="randomBtn">⟳ randomise pattern</button>
        <button class="btn-save" id="saveBtn">↓ save frame</button>
      </div>
    </div>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <span class="dot"></span>
    scroll to change pattern
    <span class="dot"></span>
  </div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script>
/* ──────────────────────────────────────────
   STATE
────────────────────────────────────────── */
// What the simulation actually reads each frame
let P = { m:8, n:4, a:1, b:1, v:0.02, num:10000 };

// Destination of next pattern
let TARGET = { m:8, n:4, a:1, b:1 };
// Snapshot of params at moment transition began
let FROM   = { m:8, n:4, a:1, b:1 };

let lerpT      = 1.0;   // 1 = settled, 0 = just triggered
let lerpFrame  = 0;
const LERP_DUR = 72;    // frames — about 1.2s, weighted feel

let colorMode = 'white';
let patternN  = 0;

const COLORS = {
  white: (p)     => p.stroke(255, 255, 255, 218),
  gold:  (p)     => p.stroke(200, 168, 75, 205),
  heat:  (p, eq) => {
    const t = Math.min(Math.abs(eq), 1);
    p.stroke(p.lerpColor(p.color(30, 80, 220), p.color(220, 50, 30), t));
  },
  cyan:  (p)     => p.stroke(80, 220, 220, 205),
};

/* ──────────────────────────────────────────
   P5 SKETCH
────────────────────────────────────────── */
new p5(function(p) {
  const PI      = Math.PI;
  const MIN_W   = 0.002;
  const MAX_PTS = 15000;
  let pts = [], W, H;
  let fcnt = 0, lastT = performance.now();

  window._saveCanvas = () => p.saveCanvas('chladni', 'png');

  function chladni(x, y) {
    return P.a * Math.sin(PI * P.n * x) * Math.sin(PI * P.m * y)
         + P.b * Math.sin(PI * P.m * x) * Math.sin(PI * P.n * y);
  }

  function Pt() {
    this.x  = p.random(0.05, 0.95);
    this.y  = p.random(0.05, 0.95);
    this.eq = 0;
  }
  Pt.prototype.move = function() {
    this.eq = chladni(this.x, this.y);

    // During transition, briefly raise vibration — sand "shaking loose"
    // peaks right at the start then decays with the lerp
    const shake = lerpT < 1 ? Math.pow(1 - lerpT, 1.6) * 0.05 : 0;
    let amp = (P.v + shake) * Math.abs(this.eq);
    if (amp < MIN_W) amp = MIN_W;

    this.x += p.random(-amp, amp);
    this.y += p.random(-amp, amp);

    if (this.x < 0)  this.x = -this.x;
    if (this.x > 1)  this.x = 2 - this.x;
    if (this.y < 0)  this.y = -this.y;
    if (this.y > 1)  this.y = 2 - this.y;
    this.x = p.constrain(this.x, 0, 1);
    this.y = p.constrain(this.y, 0, 1);
  };
  Pt.prototype.show = function() {
    COLORS[colorMode](p, this.eq);
    p.point(this.x * W, this.y * H);
  };

  p.setup = function() {
    const c = document.getElementById('sketch-container');
    const cnv = p.createCanvas(c.offsetWidth, c.offsetHeight);
    cnv.parent('sketch-container');
    p.pixelDensity(Math.min(window.devicePixelRatio, 2));
    W = p.width; H = p.height;
    for (let i = 0; i < MAX_PTS; i++) pts.push(new Pt());
  };

  p.draw = function() {
    // ── Advance lerp ──
    if (lerpT < 1) {
      lerpFrame++;
      // easeOutQuart: fast initial displacement, slow settle
      const raw = Math.min(lerpFrame / LERP_DUR, 1);
      lerpT = 1 - Math.pow(1 - raw, 4);

      // Integer params: snap at midpoint to feel like a physical shift, not a tween
      const snap = lerpT >= 0.5 ? 1 : 0;
      P.m = snap ? TARGET.m : FROM.m;
      P.n = snap ? TARGET.n : FROM.n;
      P.a = snap ? TARGET.a : FROM.a;
      P.b = snap ? TARGET.b : FROM.b;

      syncSliders();
      updateEquation();
    }

    p.background(17);
    p.strokeWeight(1.3);
    const n = Math.min(P.num, pts.length);
    for (let i = 0; i < n; i++) { pts[i].move(); pts[i].show(); }

    // FPS counter
    fcnt++;
    const now = performance.now();
    if (now - lastT > 600) {
      document.getElementById('stat-fps').textContent =
        Math.round(fcnt / ((now - lastT) / 1000));
      fcnt = 0; lastT = now;
    }
  };

  p.windowResized = function() {
    const c = document.getElementById('sketch-container');
    p.resizeCanvas(c.offsetWidth, c.offsetHeight);
    W = p.width; H = p.height;
  };
}, 'sketch-container');

/* ──────────────────────────────────────────
   HELPERS
────────────────────────────────────────── */
function syncSliders() {
  ['m','n','a','b'].forEach(k => {
    document.getElementById(k+'Slider').value = P[k];
    document.getElementById(k+'Val').textContent = P[k];
  });
}

function updateEquation() {
  document.getElementById('eq-a').textContent  = P.a;
  document.getElementById('eq-b').textContent  = P.b;
  document.getElementById('eq-m').textContent  = P.m;
  document.getElementById('eq-n').textContent  = P.n;
  document.getElementById('eq-m2').textContent = P.m;
  document.getElementById('eq-n2').textContent = P.n;
  document.getElementById('stat-nodes').textContent = P.m + P.n;
}

/* ──────────────────────────────────────────
   TRIGGER PATTERN CHANGE
────────────────────────────────────────── */
const randInt    = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const randChoice = arr    => arr[Math.floor(Math.random() * arr.length)];
const aVals = [-2, -1, 1, 2];

function triggerPattern() {
  patternN++;

  // Freeze current state as the "from" snapshot
  FROM.m = P.m; FROM.n = P.n;
  FROM.a = P.a; FROM.b = P.b;

  // Pick new target
  TARGET.m = randInt(1, 16);
  TARGET.n = randInt(1, 16);
  TARGET.a = randChoice(aVals);
  TARGET.b = randChoice(aVals);

  // Restart lerp
  lerpFrame = 0;
  lerpT     = 0;

  // Flash
  const overlay = document.getElementById('flash-overlay');
  overlay.classList.remove('burst');
  void overlay.offsetWidth;
  overlay.classList.add('burst');

  // Button pulse
  const btn = document.getElementById('randomBtn');
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');

  // Badge
  const badge = document.getElementById('badge');
  badge.textContent = `#${patternN}  m=${TARGET.m} n=${TARGET.n}`;
  badge.classList.add('on');
  clearTimeout(badge._t);
  badge._t = setTimeout(() => badge.classList.remove('on'), 2200);

  document.getElementById('stat-pattern').textContent = '#' + patternN;
}

/* ──────────────────────────────────────────
   SLIDERS (manual override — skips lerp)
────────────────────────────────────────── */
const sliderCfg = [
  ['mSlider', 'mVal', 'm', v => parseInt(v),   v => v],
  ['nSlider', 'nVal', 'n', v => parseInt(v),   v => v],
  ['aSlider', 'aVal', 'a', v => parseInt(v),   v => v],
  ['bSlider', 'bVal', 'b', v => parseInt(v),   v => v],
  ['vSlider', 'vVal', 'v', v => parseFloat(v), v => parseFloat(v).toFixed(2)],
  ['numSlider','numVal','num', v => parseInt(v), v => Math.round(v/1000)+'k'],
];
sliderCfg.forEach(([id, valId, key, parse, fmt]) => {
  const sl  = document.getElementById(id);
  const out = document.getElementById(valId);
  out.textContent = fmt(sl.value);
  sl.addEventListener('input', () => {
    P[key] = TARGET[key] = FROM[key] = parse(sl.value);
    lerpT  = 1; // cancel any active transition
    out.textContent = fmt(sl.value);
    updateEquation();
  });
});

/* ──────────────────────────────────────────
   COLOR MODE
────────────────────────────────────────── */
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    colorMode = btn.dataset.mode;
  });
});

/* ──────────────────────────────────────────
   BUTTONS
────────────────────────────────────────── */
document.getElementById('randomBtn').addEventListener('click', triggerPattern);
document.getElementById('saveBtn').addEventListener('click', () => {
  if (window._saveCanvas) window._saveCanvas();
});

/* ──────────────────────────────────────────
   SCROLL → new pattern every 100vh
────────────────────────────────────────── */
const scrollBar  = document.getElementById('scroll-bar');
const scrollHint = document.getElementById('scrollHint');
let lastBucket   = -1;
let hintGone     = false;

window.addEventListener('scroll', () => {
  const sy     = window.scrollY;
  const VH     = window.innerHeight;
  const bucket = Math.floor(sy / VH);

  // Progress bar (0→1 within the current VH bucket)
  scrollBar.style.width = ((sy % VH) / VH * 100) + '%';

  // Fire on bucket change (ignore the very first bucket which is bucket 0 at load)
  if (bucket !== lastBucket) {
    if (lastBucket !== -1) triggerPattern();
    lastBucket = bucket;
  }

  // Hide scroll hint after first move
  if (!hintGone && sy > 30) {
    hintGone = true;
    scrollHint.classList.add('hidden');
  }
}, { passive: true });

/* ──────────────────────────────────────────
   INIT
────────────────────────────────────────── */
updateEquation();
document.getElementById('stat-pattern').textContent = '#0';
</script>
</body>
</html>
